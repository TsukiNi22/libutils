name: Build - Packages (CI/CD)

on:
  workflow_dispatch: # Triggered by Dispatch (CI/CD)
    inputs:
      stable:
        description: 'Stable release build'
        required: true
        type: string
        default: 'OFF'

concurrency:
  group: packages-${{ github.repository }}
  cancel-in-progress: false # queue the syncs, never cancel a publication

env:
  LIBRARIES: "libutils.a libutils_debug.a libutils_asan.a"
  PACKAGES: "libutils libutils-dev libutils-dev-op libutils-dev-db libutils-dev-as libutils-op libutils-db libutils-as"
  WINDOWS_PACKAGES: "mingw64-libutils mingw64-libutils-dev mingw64-libutils-dev-op mingw64-libutils-dev-db mingw64-libutils-op mingw64-libutils-db"

jobs:
  build-packages:
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.hpp', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build packages (Release)
        run: |
          set -e
          cmake -S . -B build -DUTILS_STABLE_RELEASE=${{ inputs.stable }} -DPACKAGE_RELEASE=${{ github.run_number }}
          cmake --build build --target package_release --parallel $(nproc)
        timeout-minutes: 6

      - name: Show ccache stats
        run: ccache -s

      - name: Check libraries
        run: |
          set -euo pipefail
          for library in $LIBRARIES; do
            if [ ! -f "./build/$library" ]; then
              echo "::error title=Missing library, file=$library::Library '$library' not found"
              exit 1
            fi
            echo "✓ Library '$library' ok"
          done

      - name: Check packages
        run: |
          set -euo pipefail
          declare -A PACKAGE_PATTERNS=(
            ["libutils"]="libutils-*-Linux.@ext@"
            ["libutils-op"]="libutils-op-*-lib.@ext@"
            ["libutils-db"]="libutils-db-*-lib.@ext@"
            ["libutils-as"]="libutils-as-*-lib.@ext@"
            ["libutils-dev"]="libutils-dev-*-headers.@ext@"
            ["libutils-dev-op"]="libutils-dev-*-headers-op.@ext@"
            ["libutils-dev-db"]="libutils-dev-*-headers-db.@ext@"
            ["libutils-dev-as"]="libutils-dev-*-headers-as.@ext@"
          )

          for package in $(echo $PACKAGES | tr ',' ' ' | xargs); do
            for ext in rpm deb; do
              pattern="${PACKAGE_PATTERNS[$package]//@ext@/$ext}"
              FILE=$(find ./build -maxdepth 1 -name "$pattern" -print -quit)

              if [ -z "$FILE" ]; then
                echo "::error title=Missing package (${ext^^})::Package '$package' (.$ext) not found (pattern: $pattern)"
                exit 1
              fi
              echo "✓ Package '$package' (.$ext) ok -> $(basename "$FILE")"
            done
          done

      - name: Check packages (Arch)
        run: |
          set -euo pipefail
          VERSION_RE='[0-9.]+-[0-9]+' # <pkgver>-<pkgrel>
          declare -A PACKAGE_PATTERNS=(
            ["libutils"]="libutils(-pre)?-$VERSION_RE-any"
            ["libutils-op"]="libutils-op(-pre)?-$VERSION_RE-x86_64"
            ["libutils-db"]="libutils-db(-pre)?-$VERSION_RE-x86_64"
            ["libutils-as"]="libutils-as(-pre)?-$VERSION_RE-x86_64"
            ["libutils-dev"]="libutils-dev(-pre)?-$VERSION_RE-any"
            ["libutils-dev-op"]="libutils-dev-op(-pre)?-$VERSION_RE-any"
            ["libutils-dev-db"]="libutils-dev-db(-pre)?-$VERSION_RE-any"
            ["libutils-dev-as"]="libutils-dev-as(-pre)?-$VERSION_RE-any"
          )

          for package in $(echo $PACKAGES | tr ',' ' ' | xargs); do
            pattern="${PACKAGE_PATTERNS[$package]}\.pkg\.tar\.zst"
            FILE=$(find ./build -maxdepth 1 -regextype posix-extended -regex ".*/$pattern" -print -quit)

            if [ -z "$FILE" ]; then
              echo "::error title=Missing package (ARCH)::Package '$package' (.pkg.tar.zst) not found (pattern: $pattern)"
              exit 1
            fi
            echo "✓ Package '$package' (.pkg.tar.zst) ok -> $(basename "$FILE")"
          done

      - name: Upload compiled packages
        uses: actions/upload-artifact@v6
        with:
          name: compiled-packages
          path: |
            build/*.rpm
            build/*.deb
            build/*.pkg.tar.zst
          retention-days: 1

  build-packages-windows:
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/mingw64-ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/ccache
          key: ccache-mingw64-${{ hashFiles('**/*.cpp', '**/*.hpp', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-mingw64-

      - name: Build packages (Release, MinGW-w64)
        run: |
          set -e
          cmake -S . -B build -DCMAKE_TOOLCHAIN_FILE=cmake/toolchain/mingw-w64.cmake -DUTILS_STABLE_RELEASE=${{ inputs.stable }} -DPACKAGE_RELEASE=${{ github.run_number }}
          cmake --build build --target package_release --parallel $(nproc)
        timeout-minutes: 8

      - name: Show ccache stats
        run: ccache -s

      - name: Check packages
        run: |
          set -euo pipefail
          declare -A PACKAGE_PATTERNS=(
            ["mingw64-libutils"]="mingw64-libutils-*-win64.@ext@"
            ["mingw64-libutils-op"]="mingw64-libutils-op-*-lib.@ext@"
            ["mingw64-libutils-db"]="mingw64-libutils-db-*-lib.@ext@"
            ["mingw64-libutils-dev"]="mingw64-libutils-dev-*-headers.@ext@"
            ["mingw64-libutils-dev-op"]="mingw64-libutils-dev-*-headers-op.@ext@"
            ["mingw64-libutils-dev-db"]="mingw64-libutils-dev-*-headers-db.@ext@"
          )

          for package in $WINDOWS_PACKAGES; do
            for ext in rpm deb; do
              pattern="${PACKAGE_PATTERNS[$package]//@ext@/$ext}"
              FILE=$(find ./build -maxdepth 1 -name "$pattern" -print -quit)

              if [ -z "$FILE" ]; then
                echo "::error title=Missing package (${ext^^})::Package '$package' (.$ext) not found (pattern: $pattern)"
                exit 1
              fi
              echo "✓ Package '$package' (.$ext) ok -> $(basename "$FILE")"
            done
          done

      - name: Upload compiled packages
        uses: actions/upload-artifact@v6
        with:
          name: compiled-packages-windows
          path: |
            build/*.rpm
            build/*.deb
          retention-days: 1

  sync-online-packages:
    needs: [build-packages, build-packages-windows]
    if: needs.build-packages.result == 'success' && needs.build-packages-windows.result == 'success'
    permissions:
      contents: write

    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/package:latest

    steps:
      - name: Download compiled packages
        uses: actions/download-artifact@v7
        with:
          pattern: compiled-packages*
          merge-multiple: true
          path: build

      - name: Checkout libutils - gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          path: gh-pages
          fetch-depth: 1

      - name: Import GPG key
        run: |
          set -e
          echo "${{ secrets.GPG_PRIVATE_KEY }}" | base64 -d | gpg --batch --import
          echo "allow-loopback-pinentry" >> ~/.gnupg/gpg-agent.conf
          echo "pinentry-mode loopback" >> ~/.gnupg/gpg.conf

      - name: Sign packages (RPM)
        run: |
          set -e
          # Import public key into RPM before verification
          gpg --armor --export "${{ secrets.GPG_KEY_ID }}" > /tmp/pubkey.asc
          rpm --import /tmp/pubkey.asc

          # Configure RPM to use the GPG key and non-interactive signing.
          cat > ~/.rpmmacros <<EOF
          %_signature gpg
          %_gpg_name ${{ secrets.GPG_KEY_ID }}
          %__gpg $(command -v gpg)
          %_gpg_sign_cmd_extra_args --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}"
          EOF

          # Sign RPM packages
          rpm --addsign build/*.rpm

          # Check of the signature
          for f in build/*.rpm; do
            echo "Checking signature: $f"
            rpm -Kv "$f"
          done

      - name: Sync files into gh-pages (RPM)
        run: |
          set -euo pipefail
          REPO_DIR="gh-pages/fedora/44/x86_64"
          mkdir -p "$REPO_DIR" # Security
          mv build/*.rpm $REPO_DIR/

          # Keep every release, only the 5 last versions of each pre-release package
          prune_pre() {
              local dir="$1" ext="$2" keep=5
              find "$dir" -maxdepth 1 -name "*-pre-[0-9]*.${ext}" -printf '%f\n' \
                  | sed -E 's/^(.+-pre)-([0-9]+\.[0-9]+\.[0-9]+)-(.+)$/\1 \2 \3/' \
                  | sort -k1,1 -k3,3 -k2,2V \
                  | awk -v keep="$keep" '{key = $1 " " $3; n[key]++; f[key, n[key]] = $1 "-" $2 "-" $3} END {for (k in n) for (i = 1; i <= n[k] - keep; i++) print f[k, i]}' \
                  | while read -r file; do echo "Prune old pre-release: $file"; rm -f "$dir/$file"; done
          }
          prune_pre "$REPO_DIR" rpm

      - name: Update metadata and signature (RPM)
        working-directory: gh-pages/fedora/44/x86_64
        run: |
          set -e
          createrepo_c --update .
          rm -f repodata/repomd.xml.asc
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign --armor repodata/repomd.xml

      - name: Sync files into gh-pages (DEB)
        run: |
          set -euo pipefail
          POOL_DIR="gh-pages/debian/pool/main"
          mkdir -p "$POOL_DIR"
          mv build/*.deb "$POOL_DIR/"

          # Keep every release, only the 5 last versions of each pre-release package
          prune_pre() {
              local dir="$1" ext="$2" keep=5
              find "$dir" -maxdepth 1 -name "*-pre-[0-9]*.${ext}" -printf '%f\n' \
                  | sed -E 's/^(.+-pre)-([0-9]+\.[0-9]+\.[0-9]+)-(.+)$/\1 \2 \3/' \
                  | sort -k1,1 -k3,3 -k2,2V \
                  | awk -v keep="$keep" '{key = $1 " " $3; n[key]++; f[key, n[key]] = $1 "-" $2 "-" $3} END {for (k in n) for (i = 1; i <= n[k] - keep; i++) print f[k, i]}' \
                  | while read -r file; do echo "Prune old pre-release: $file"; rm -f "$dir/$file"; done
          }
          prune_pre "$POOL_DIR" deb

      - name: Update metadata and signature (DEB)
        working-directory: gh-pages/debian
        run: |
          set -euo pipefail
          DIST_DIR="dists/stable/main/binary-amd64"
          mkdir -p "$DIST_DIR"

          # Generate Packages index
          dpkg-scanpackages --multiversion pool/main /dev/null > "$DIST_DIR/Packages"
          gzip -k -f "$DIST_DIR/Packages"
          xz -k -f "$DIST_DIR/Packages"

          # Generate Release file
          cat > dists/stable/Release <<EOF
          Origin: TsukiNi22
          Label: libutils
          Suite: stable
          Codename: stable
          Architectures: amd64
          Components: main
          Description: libutils APT repository
          Date: $(date -Ru)
          EOF

          apt-ftparchive release dists/stable >> dists/stable/Release

          # Sign the Release file
          rm -f dists/stable/Release.gpg dists/stable/InRelease
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --default-key "${{ secrets.GPG_KEY_ID }}" \
            --detach-sign --armor -o dists/stable/Release.gpg dists/stable/Release
          gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
            --default-key "${{ secrets.GPG_KEY_ID }}" \
            --clearsign -o dists/stable/InRelease dists/stable/Release

      - name: Sync files into gh-pages (Arch)
        run: |
          set -euo pipefail
          REPO_DIR="gh-pages/arch/x86_64"
          mkdir -p "$REPO_DIR"

          # Sign the packages (detached binary signatures, read by repo-add and pacman)
          for f in build/*.pkg.tar.zst; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --default-key "${{ secrets.GPG_KEY_ID }}" --detach-sign --no-armor -o "$f.sig" "$f"
          done
          mv build/*.pkg.tar.zst build/*.pkg.tar.zst.sig "$REPO_DIR/"

          # Keep every release, only the 5 last versions of each pre-release package (<name>-pre-<pkgver>-<pkgrel>-<arch>)
          find "$REPO_DIR" -maxdepth 1 -name "*-pre-[0-9]*.pkg.tar.zst" -printf '%f\n' \
              | sed -E 's/^(.+-pre)-([0-9.]+-[0-9]+)-([a-z0-9_]+)\.pkg\.tar\.zst$/\1 \2 \3/' \
              | sort -k1,1 -k2,2V \
              | awk -v keep=5 '{n[$1]++; f[$1, n[$1]] = $1 "-" $2 "-" $3 ".pkg.tar.zst"} END {for (k in n) for (i = 1; i <= n[k] - keep; i++) print f[k, i]}' \
              | while read -r file; do echo "Prune old pre-release: $file"; rm -f "${REPO_DIR:?}/${file:?}" "${REPO_DIR:?}/${file:?}.sig"; done

      - name: Update metadata and signature (Arch)
        working-directory: gh-pages/arch/x86_64
        run: |
          set -euo pipefail
          # Database rebuilt from every package, oldest first (the last version of a package wins)
          rm -f libutils.db* libutils.files*
          find . -maxdepth 1 -name "*.pkg.tar.zst" -printf '%f\n' | sort -V | xargs repo-add -q --include-sigs libutils.db.tar.gz

          # GitHub Pages: real files instead of the symbolic links of repo-add, signed databases
          for db in libutils.db libutils.files; do
            cp --remove-destination "$db.tar.gz" "$db"
            gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" \
              --default-key "${{ secrets.GPG_KEY_ID }}" --detach-sign --no-armor -o "$db.sig" "$db"
            cp "$db.sig" "$db.tar.gz.sig"
          done

      - name: Commit and push
        working-directory: gh-pages
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore: sync packages from main (${{ github.sha }})"
          git push origin gh-pages
