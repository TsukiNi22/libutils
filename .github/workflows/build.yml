name: CI - Library

on:
  workflow_run:
    workflows: ["CI/CD - Library"]
    types: [completed]

env:
  LIBRARYS: "libutils.a libutils_debug.a libutils_asan.a"
 
permissions:
  actions: read

jobs:
  should-build:
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    outputs:
      build: ${{ steps.decide.outputs.build }}

    steps:
      - name: Get build-packages result from triggering run
        id: decide
        run: |
          set -e
          CONCLUSION=$(curl -s \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs/${{ github.event.workflow_run.id }}/jobs" \
            | jq -r '.jobs[] | select(.name=="build-packages") | .conclusion')

          echo "build-packages conclusion: $CONCLUSION"

          if [[ "$CONCLUSION" == "skipped" ]]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  build-release:
    needs: actions
    if: needs.should-build.outputs.build == 'true'

    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.hpp', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build libraries (Release)
        run: |
          set -e
          cmake -S . -B build
          cmake --build build --target release --parallel $(nproc)
        timeout-minutes: 2

      - name: Show ccache stats
        run: ccache -s

      - name: Check libraries
        run: |
          set -euo pipefail
          for library in $(echo $LIBRARYS | tr ',' ' ' | xargs); do
            if [ ! -f "./build/$library" ]; then
              echo "::error title=Missing library, file=$library::Library '$library' not found"
              exit 1
            fi
            echo "✓ Library '$library' ok"
          done
