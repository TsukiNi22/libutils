name: CI/CD - Library

on:
  push:
    branches: [main]

env:
  LIBRARYS: "libutils.a libutils_debug.a"

jobs:
  build-libraries:
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/ci:latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Cache ccache
        uses: actions/cache@v5
        with:
          path: /github/home/.cache/ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('**/*.cpp', '**/*.hpp', 'CMakeLists.txt') }}
          restore-keys: |
            ccache-${{ runner.os }}-

      - name: Build libraries (Release)
        run: |
          set -e
          cmake -S . -B build
          cmake --build build --target release --parallel $(nproc)
        timeout-minutes: 2

      - name: Show ccache stats
        run: ccache -s

      - name: Check libraries
        run: |
          set -euo pipefail
          for library in $(echo $LIBRARYS | tr ',' ' ' | xargs); do
            if [ ! -f "./build/$library" ]; then
              echo "::error title=Missing library, file=$library::Library '$library' not found"
              exit 1
            fi
            echo "✓ Library '$library' ok"
          done

      - name: Upload compiled libraries
        uses: actions/upload-artifact@v6
        with:
          name: compiled-libs
          path: |
            build/libutils.a
            build/libutils_debug.a
            build/libutils_asan.a

  sync-template:
    needs: build-libraries
    if: github.event_name == 'push' && needs.build-libraries.result == 'success'

    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    container:
      image: ghcr.io/tsukini22/ci:latest

    steps:
      - name: Checkout my_lib_cpp
        uses: actions/checkout@v5
        with:
          path: my_lib_cpp

      - name: Download compiled libraries
        uses: actions/download-artifact@v7
        with:
          name: compiled-libs
          path: build

      - name: Checkout cpp_project_template
        uses: actions/checkout@v5
        with:
          repository: TsukiNi22/cpp_project_template
          token: ${{ secrets.TEMPLATE_REPO_TOKEN }}
          path: cpp_project_template

      - name: Sync files into template
        run: |
          set -e
          rm -rf cpp_project_template/cmake/config
          rm -rf cpp_project_template/cmake/scripts
          rm -rf cpp_project_template/include/utils

          cp -r my_lib_cpp/cmake/config  cpp_project_template/cmake/config
          cp -r my_lib_cpp/cmake/scripts cpp_project_template/cmake/scripts
          cp -r my_lib_cpp/include/utils cpp_project_template/include/utils

          cp build/libutils.a       cpp_project_template/cmake/libs/libutils.a
          cp build/libutils_debug.a cpp_project_template/cmake/libs/libutils_debug.a
          cp build/libutils_asan.a  cpp_project_template/cmake/libs/libutils_asan.a

      - name: Commit and push
        working-directory: cpp_project_template
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add cmake/ include/utils/
          if git diff --cached --quiet; then
            echo "No changes to sync."
            exit 0
          fi
          git commit -m "chore: sync utils lib from my_lib_cpp (${{ github.sha }})"
          git push origin main
