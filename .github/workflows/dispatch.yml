name: Dispatch (CI/CD)

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore:
      - '**.md'
      - '**.txt'

permissions:
  actions: write

jobs:
  dispatch:
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash

    outputs:
      build: ${{ steps.decide.outputs.build }}
      stable: ${{ steps.decide.outputs.stable }}
      release: ${{ steps.decide.outputs.release }}

    steps:
      - name: Determine branches
        id: decide
        run: |
          set -e
          MESSAGE_HAS_BUILD='${{ contains(github.event.head_commit.message, '[build]') }}'
          MESSAGE_HAS_RELEASE='${{ contains(github.event.head_commit.message, '[release]') }}'

          # Determine branches
          if [[ "${{ github.ref_type }}" == "tag" ]]; then # On tag push
            if [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?-release$ ]]; then
              BUILD=true; STABLE=ON; RELEASE=true
            elif [[ "${{ github.ref_name }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?-pre$ ]]; then
              BUILD=true; STABLE=OFF; RELEASE=false
            else
              BUILD=false; STABLE=OFF; RELEASE=false
            fi
          else # On normal push
            [[ "$MESSAGE_HAS_BUILD" == "true" ]] && BUILD=true || BUILD=false
            [[ "$MESSAGE_HAS_RELEASE" == "true" ]] && RELEASE=true || RELEASE=false
            STABLE=OFF
          fi

          # Store result & display them
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "stable=$STABLE" >> "$GITHUB_OUTPUT"
          echo "release=$RELEASE" >> "$GITHUB_OUTPUT"
          echo "Decision: build=$BUILD stable=$STABLE release=$RELEASE"

  notify-build-packages:
    needs: dispatch
    if: needs.dispatch.outputs.build == 'true'
 
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash
 
    steps:
      - name: Trigger build-packages.yml (workflow_dispatch)
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-packages.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}","inputs":{"stable":"${{ needs.dispatch.outputs.stable }}"}}'

  notify-build-libraries:
    needs: dispatch
    if: needs.dispatch.outputs.build == 'false'
  
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash
  
    steps:
      - name: Trigger build-libraries.yml (workflow_dispatch)
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/build-libraries.yml/dispatches" \
            -d '{"ref":"${{ github.ref_name }}"}'
  
  notify-release:
    needs: dispatch
    if: needs.dispatch.outputs.release == 'true'
  
    runs-on: ${{ vars.RUNNER }}
    defaults:
      run:
        shell: bash
  
    steps:
      - name: Trigger docker-image (repository_dispatch)
        run: |
          curl -sf -X POST \
            -H "Authorization: Bearer ${{ secrets.DOCKER_IMAGE_REPO_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/TsukiNi22/docker-image/dispatches" \
            -d '{
              "event_type": "libutils-released",
              "client_payload": {
                "ref": "${{ github.ref_name }}"
              }
            }'
